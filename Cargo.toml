[package]
name = "pretxsim-mcp"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Official Rust MCP SDK
rmcp = { version = "0.3", features = ["server", "macros", "transport-streamable-http-server", "transport-worker"] }

# HTTP Web Framework for Streamable HTTP transport
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[workspace]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
